# The Nginx configuration of the AssetFlow edge.
#
#   /            -> the React SPA (history fallback to index.html)
#   /api/*       -> the NestJS API container
#   /api/metrics -> NOT proxied: Prometheus scrapes the API container
#                   directly on the internal Docker network.
#
# TLS certificates live in /etc/letsencrypt (mounted from the host).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access log — one line per request, easy to grep.
    log_format  json_combined  escape=json
        '{'
          '"ts":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$request_uri",'
          '"status":$status,'
          '"bytes":$body_bytes_sent,'
          '"duration":$request_time,'
          '"request_id":"$http_x_request_id",'
          '"user_agent":"$http_user_agent"'
        '}';

    access_log  /var/log/nginx/access.log  json_combined;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Uploads (documents) are limited to 10 MB.
    client_max_body_size 10m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml+rss text/javascript image/svg+xml;

    # Rate limiting at the edge: a cheap first line of defence in front of
    # the application limit (the API throttles per IP as well).
    limit_req_zone  $binary_remote_addr zone=api_per_ip:10m rate=100r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
