# The public virtual host.
#
# In the demo (local) setup the certificate is self-signed; on a real server
# certbot writes a Let's Encrypt certificate into /etc/letsencrypt and
# `scripts/issue-cert.sh` renews it.

upstream assetflow_api {
    server api:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # The ACME challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else is redirected to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/assetflow/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assetflow/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              off;

    # ------------------------------------------------------------- security
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # A hidden nginx version is one less information for an attacker.
    server_tokens off;

    # -------------------------------------------------------------- the API
    location /api/ {
        limit_req zone=api_per_ip burst=200 nodelay;

        proxy_pass         http://assetflow_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_buffering    off;   # stream the responses, do not buffer them
    }

    # ------------------------------------------------------------------ SPA
    root /usr/share/nginx/html;
    index index.html;

    # Static assets are immutable (Vite hashes their names).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The SPA does its own routing — every other path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A tiny endpoint for the container health check.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }
}
