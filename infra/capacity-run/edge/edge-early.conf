# Diagnostics-only edge config.
#
# Used from the moment the packages stage has finished until the full routing
# config replaces it at the end of the run. The early status service listens on
# loopback 9444; this is what makes it reachable from the operator's own address
# on the one approved port, 8443.
#
# WHY A SEPARATE CONFIG
# The full edge config routes /api and /evidence as well, and those services do
# not exist yet when this config runs. Routing /api before the application
# exists would answer 502, which reads like an application fault when the truth
# is "we are still installing packages". This config therefore answers exactly
# two things and nothing else:
#
#   /status*  -> the bootstrap-status service on loopback 9444
#   anything  -> 503 with a short body naming the stage
#
# It serves no files, no evidence, no configuration, no keys and no tokens. The
# access log is off for this server block: a bearer token must never be written
# to a log that is later archived as evidence.
server {
    listen 8443 ssl;
    server_name capacity-run.test;

    ssl_certificate     /etc/capacity-run/tls.crt;
    ssl_certificate_key /etc/capacity-run/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;

    # The diagnostic channel. Answers while migrations, seeding and the
    # application are still absent or failing, which is precisely when it is
    # needed and precisely when it was previously unreachable.
    location /status {
        proxy_pass http://127.0.0.1:9444;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
    }

    location / {
        default_type text/plain;
        return 503 "bootstrap in progress\n";
    }
}
