# Single-port TLS edge for the capacity run.
#
# One inbound port, three destinations:
#   /status*                -> the bootstrap-status service on loopback 9444
#   /evidence/<name>.tar.gz -> the Python evidence server on loopback 9443
#   everything else         -> the application edge on loopback 8080
#
# /status is routed FIRST and by exact prefix, so it can never be shadowed by
# the catch-all. It is exempt from the application's rate limiter on purpose:
# a client polling for diagnostics must not be throttled by the app, and the
# app may not be up at all when the poll succeeds.
#
# The application's own nginx keeps its limit_req zone and burst settings; this
# proxy passes /api through unmodified, so the production limiter is untouched.
server {
    listen 8443 ssl;
    server_name capacity-run.test;

    ssl_certificate     /etc/capacity-run/tls.crt;
    ssl_certificate_key /etc/capacity-run/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Diagnostic channel. Answers while the application is still failing or
    # absent, which is precisely when it is needed. The upstream is TLS-only,
    # so nginx proxies over TLS and verifies it (see edge-early.conf for the
    # full rationale; a plain-HTTP proxy_pass here answers 502 forever).
    location /status {
        proxy_pass https://127.0.0.1:9444;
        proxy_ssl_trusted_certificate /etc/capacity-run/proxy-ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 1;
        proxy_ssl_server_name on;
        proxy_ssl_name capacity-run.test;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
    }

    # The evidence server is TLS-only for the same reason, so this hop is
    # verified TLS too.
    location /evidence/ {
        proxy_pass https://127.0.0.1:9443;
        proxy_ssl_trusted_certificate /etc/capacity-run/proxy-ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 1;
        proxy_ssl_server_name on;
        proxy_ssl_name capacity-run.test;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        client_max_body_size 64m;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
