# Minimal nginx for the single-port capacity edge. Loaded by the nginx container.
worker_processes 1;
error_log /var/log/nginx/capacity-edge-error.log warn;
pid /run/capacity-edge.pid;
events { worker_connections 1024; }
http {
    access_log /var/log/nginx/capacity-edge-access.log;
    sendfile on;
    include /etc/capacity-edge/edge.conf;
}
