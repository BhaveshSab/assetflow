# The alert rules.
#
# Every rule answers a question an on-call engineer would ask:
#   "Is the API up?  Are users getting errors?  Is it slow?  Is the disk
#    full?  Is the database gone?  Is the backup still running?  Did the
#    shared rate-limit store break?"
#
# The thresholds are deliberately conservative for a student project: a false
# alarm at 3 AM is worse than a slightly late detection.

groups:
  - name: assetflow-api
    rules:
      - alert: AssetflowApiDown
        expr: up{job="assetflow-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The AssetFlow API does not answer"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for 2 minutes. The API is either down or the deployment failed."
          runbook: "docs/RUNBOOK.md#api-down"

      - alert: AssetflowHighErrorRate
        expr: |
          sum(rate(assetflow_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(assetflow_http_requests_total[5m])), 0.001)
            > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of the requests fail with a 5xx"
          description: "The error ratio has been above 5% for 10 minutes. Check the API logs for the failing routes."
          runbook: "docs/RUNBOOK.md#many-5xx-errors"

      - alert: AssetflowHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(assetflow_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The 95th percentile of the API latency is above one second"
          description: "p95 is {{ $value }}s. Check the database (slow query?) and the host (CPU, IO)."

  - name: assetflow-host
    rules:
      - alert: HostDiskAlmostFull
        expr: |
          (
            1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
                 / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})
          ) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The disk of {{ $labels.mountpoint }} is more than 85% full"
          description: "{{ $value | humanizePercentage }} of disk space is used. Docker images and log files are the usual suspects."
          runbook: "docs/RUNBOOK.md#disk-full"

      - alert: HostDiskFull
        expr: |
          (
            1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
                 / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})
          ) > 0.95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The disk of {{ $labels.mountpoint }} is almost full"
          description: "The host is about to stop writing — the database and the API will fail."

      - alert: HostMemoryPressure
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The host uses more than 90% of its memory"

      - alert: HostCpuSaturated
        expr: |
          1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The host CPU has been above 90% for 15 minutes"

  - name: assetflow-data
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is not reachable"
          description: "Every API request that touches the database is failing."
          runbook: "docs/RUNBOOK.md#database-down"

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The database has more than 80 open connections"

      - alert: BackupTooOld
        expr: assetflow_backup_last_success_timestamp_seconds < (time() - 26 * 3600)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "The last successful backup is older than 26 hours"
          description: "The nightly backup has not completed. Without it a restore would lose a day of data."
          runbook: "docs/RUNBOOK.md#backup-failed"

      - alert: ThrottleStoreDegraded
        expr: assetflow_throttle_store_degraded == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The shared rate-limit store (Redis) is unavailable"
          description: "The API falls back to the per-process limiter — the limit is no longer global."

  - name: assetflow-containers
    rules:
      - alert: ContainerOomKilled
        expr: |
          sum by (container_label_com_docker_compose_service) (
            increase(container_oom_events_total{job="cadvisor",container_label_com_docker_compose_service!=""}[10m])
          ) > 0
        labels:
          severity: critical
        annotations:
          summary: "A container was killed by the out-of-memory killer"
          description: "Service {{ $labels.container_label_com_docker_compose_service }} had an OOM event in the last 10 minutes. Inspect its memory limit and logs."
          runbook: "docs/RUNBOOK.md#container-oom-or-restarts"

      - alert: ContainerRestartLoop
        # Docker restarts reuse an ID; recreations change it. Aggregate by
        # Compose service *before* changes() so both cases remain visible.
        expr: |
          changes((max by (container_label_com_docker_compose_service) (
            container_start_time_seconds{job="cadvisor",container_label_com_docker_compose_service!=""}
          ))[15m:30s]) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "A container is restarting repeatedly"
          description: "Service {{ $labels.container_label_com_docker_compose_service }} changed start time more than twice in 15 minutes. Inspect its exit code and logs."
          runbook: "docs/RUNBOOK.md#container-oom-or-restarts"

  - name: assetflow-https
    rules:
      - alert: HttpsCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-https"} - time() < 14 * 86400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The HTTPS certificate expires in less than 14 days"
          description: "Check certificate renewal for {{ $labels.instance }}. An expired certificate prevents browser sign-in."
          runbook: "docs/RUNBOOK.md#https-probe-or-certificate"

      - alert: HttpsProbeFailed
        expr: probe_success{job="blackbox-https"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The public HTTPS readiness check fails"
          description: "Check DNS, certificate trust/expiry, Nginx and API readiness for {{ $labels.instance }}."
          runbook: "docs/RUNBOOK.md#https-probe-or-certificate"

  - name: assetflow-container-capacity
    rules:
      # Which container is about to be OOM-killed. On a 1 GB host this is the
      # failure mode that actually happens, and node-exporter cannot see it.
      #
      # `name` is cAdvisor's container-name label since v0.47 (v0.60.6 is pinned
      # in docker-compose.yml). If the rule matches nothing while
      # `container_memory_working_set_bytes{job="cadvisor"}` is not empty, the
      # label is called `container` on that build — check it in the Prometheus
      # expression browser and rename it here, in both selectors.
      #
      # Containers without a memory limit in docker-compose.yml report a limit
      # of 0; the `and ... > 0` guard keeps them out instead of alerting on a
      # division by zero.
      - alert: ContainerMemoryNearLimit
        expr: |
          (
            container_memory_working_set_bytes{job="cadvisor", name!=""}
              / container_spec_memory_limit_bytes{job="cadvisor", name!=""}
          ) > 0.9
          and on (instance, name)
          container_spec_memory_limit_bytes{job="cadvisor", name!=""} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is above 90% of its memory limit"
          description: "It will be OOM-killed if it keeps growing. Check the container's logs and the deploy that changed it."
          runbook: "docs/RUNBOOK.md#container-memory"

      # A restart loop shows up here before users notice: the process start time
      # changes more than once an hour (OOM kill, crash on boot, broken deploy).
      - alert: ApiRestarting
        expr: changes(process_start_time_seconds{job="assetflow-api"}[1h]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The API has restarted more than once in the last hour"
          description: "A restart loop is usually an OOM kill or a crash during boot. Check the container exit code and the boot logs."
          runbook: "docs/RUNBOOK.md#api-restarting"

  - name: assetflow-tls
    rules:
      # A failed renewal is invisible until browsers start warning, so the
      # certificate has to be watched.
      #
      # Why 3 days and not 14: the threshold has to be shorter than the
      # shortest certificate this project issues. A domain certificate lives 90
      # days, but an IP certificate is only available on Let's Encrypt's
      # shortlived profile — about 6 days (infra/scripts/issue-cert.sh). Any
      # threshold above ~5 days fires permanently on an IP-only host, and an
      # alert that is always on is an alert nobody reads. With a daily renewal
      # cron, a healthy shortlived certificate sits at 5–6 days, so 3 days
      # means "two renewal attempts in a row have failed".
      - alert: TlsCertificateExpiringSoon
        expr: |
          (probe_ssl_earliest_cert_expiry{job="blackbox-https"} - time())
            < 3 * 24 * 3600
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "The TLS certificate expires in less than 3 days"
          description: "Renewal is failing. Run infra/scripts/renew-cert.sh, then check the daily cron entry (17 3 * * *) and its log in LOG_DIR."
          runbook: "docs/RUNBOOK.md#tls-expiry"
