# What Prometheus scrapes.
#
#   api:4000            -> the application metrics (/api/metrics)
#   node-exporter:9100  -> CPU, memory, disk, network of the host
#   postgres-exporter   -> database connections, transactions, locks
#
# Everything is scraped over the internal Docker network — no metric endpoint
# is reachable from the internet.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: assetflow

# Without this destination rules fire locally but no notification is sent.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: assetflow-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ['api:4000']
        labels:
          service: assetflow-api

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: host

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgres

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [https_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/targets/https.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
