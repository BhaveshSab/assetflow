- name: alerts resolve after recovery and old OOM leaves the window
  interval: 1m
  input_series:
  - series: up{job="assetflow-api",instance="api:4000"}
    values: 0+0x5 1+0x30
  - series: container_oom_events_total{job="cadvisor",container_label_com_docker_compose_service="api"}
    values: 0 1+0x35
  promql_expr_test:
  - expr: ALERTS{alertname=~"AssetflowApiDown|ContainerOomKilled",alertstate="firing"}
    eval_time: 30m
    exp_samples: []
- name: container replacements retain service identity; a single replacement is quiet
  interval: 1m
  input_series:
  - series: container_start_time_seconds{job="cadvisor",container_label_com_docker_compose_service="api",id="a"}
    values: 0 0 stale
  - series: container_start_time_seconds{job="cadvisor",container_label_com_docker_compose_service="api",id="b"}
    values: _ _ 120 120 stale
  - series: container_start_time_seconds{job="cadvisor",container_label_com_docker_compose_service="api",id="c"}
    values: _ _ _ _ 240 240 stale
  - series: container_start_time_seconds{job="cadvisor",container_label_com_docker_compose_service="api",id="d"}
    values: _ _ _ _ _ _ 360+0x24
  promql_expr_test:
  - expr: ALERTS{alertname="ContainerRestartLoop",alertstate="firing"}
    eval_time: 3m
    exp_samples: []
  - expr: ALERTS{alertname="ContainerRestartLoop",alertstate="firing"}
    eval_time: 450s
    exp_samples: []
  - expr: ALERTS{alertname="ContainerRestartLoop",alertstate="firing"}
    eval_time: 8m
    exp_samples: &id002
    - labels: '{__name__="ALERTS",alertname="ContainerRestartLoop",alertstate="firing",container_label_com_docker_compose_service="api",severity="warning"}'
      value: 1
  - expr: ALERTS{alertname="ContainerRestartLoop",alertstate="firing"}
    eval_time: 10m
    exp_samples: *id002
  - expr: ALERTS{alertname="ContainerRestartLoop",alertstate="firing"}
    eval_time: 30m
    exp_samples: []
- name: 90 percent used is not a critical disk alert (old failing fixture regression)
