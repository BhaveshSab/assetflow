# Real production rules: firing/pending, healthy/boundary and recovery.
# State + label assertions are independent of notification wording.
rule_files:
- ../rules/assetflow.yml
evaluation_interval: 30s
tests:
- name: AssetflowApiDown fires on sustained failure
  interval: 1m
  input_series:
  - series: up{job="assetflow-api",instance="api:4000"}
    values: 0+0x40
  promql_expr_test:
  - expr: ALERTS{alertname="AssetflowApiDown",alertstate="firing"}
    eval_time: 90s
    exp_samples: []
  - expr: ALERTS{alertname="AssetflowApiDown",alertstate="firing"}
    eval_time: 30m
    exp_samples:
    - labels: '{__name__="ALERTS",alertname="AssetflowApiDown",alertstate="firing",instance="api:4000",job="assetflow-api",severity="critical"}'
      value: 1
- name: AssetflowApiDown stays quiet on healthy or boundary input
  interval: 1m
  input_series:
  - series: up{job="assetflow-api",instance="api:4000"}
    values: 1+0x40
  promql_expr_test:
  - expr: ALERTS{alertname="AssetflowApiDown",alertstate="firing"}
    eval_time: 30m
    exp_samples: []
