# Optional, bounded in-memory trace viewer. Not a durable audit log.
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: warn
extensions:
  jaeger_query:
    http:
      endpoint: 0.0.0.0:16686
    storage:
      traces: memory
  jaeger_storage:
    backends:
      memory:
        memory:
          max_traces: 1000
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    send_batch_size: 64
    timeout: 2s
exporters:
  jaeger_storage_exporter:
    trace_storage: memory
