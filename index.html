<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AssetFlow — enterprise asset & resource management: allocations, transfers, bookings, maintenance, audits and analytics."
    />
    <meta name="theme-color" content="#0f111a" />
    <!--
      Paints the saved theme before the bundle is fetched, so a visitor who
      chose dark never sees a white flash on load. It must stay in step with
      `src/lib/theme.ts` — same storage key, same class, same fallback order.
      Keep it this small and this early: anything asynchronous here would
      reintroduce the flash it exists to prevent.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("assetflow-theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 22V10h3.2l3.8 6.1 3.8-6.1H23v12h-3v-7l-4 6h-.1L12 15v7z' fill='white'/%3E%3C/svg%3E"
    />
    <title>AssetFlow — Asset & Resource Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
