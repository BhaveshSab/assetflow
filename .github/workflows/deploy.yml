# Deploys the API to the self-hosted server.
#
#   find the server  ->  build the image  ->  push it to GHCR  ->  connect over SSH
#                    ->  run the migrations  ->  start it  ->  health check
#                    ->  roll back when the health check fails
#
# The variables (GitHub → Settings → Secrets and variables → Actions →
# Variables — they are not secret):
#   DEPLOY_HOST        the server address (optional: discovered when unset)
#   DEPLOY_USER        the SSH user (key authentication only; optional)
#   DEPLOY_PATH        the checkout on the server (optional: discovered)
#
# The secrets (the same page → Secrets):
#   DEPLOY_SSH_KEY    the private key of the deploy user
#
# Why the discovery step exists
# -----------------------------
# The deploy used to read `vars.DEPLOY_HOST` and nothing else. When that value
# went stale (the instance's address changed) the whole job died on a bare
# "connection timed out" with no indication of which address or user was tried,
# and the run log was the only place that said so. Discovery makes the job
# self-healing across an address change and, when it still cannot connect, it
# says exactly which combinations it tried and why each one failed — both on
# stdout and, for a run whose log is not reachable, as a check annotation.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # The build cache of the images is kept in the GitHub Actions cache.
      actions: write
    steps:
      - uses: actions/checkout@v7

      # GHCR only accepts a lowercase repository name, and the GitHub owner
      # here is `BhaveshSab` — so the name is computed once, in Bash, and
      # reused by the build and the deploy.
      - name: The image name
        id: image
        run: |
          {
            echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/assetflow-api"
            echo "migrate=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/assetflow-migrate"
            echo "web=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/assetflow-web"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.api
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=api-runtime
          cache-to: type=gha,scope=api-runtime,mode=max

      # All compilation happens on the runner, never on the small EC2 host.
      # The runtime image has no Prisma CLI: publish the migrate stage too.
      - name: Build and push the migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.api
          target: migrate
          push: true
          tags: |
            ${{ steps.image.outputs.migrate }}:latest
            ${{ steps.image.outputs.migrate }}:${{ github.sha }}
          cache-from: |
            type=gha,scope=api-runtime
            type=gha,scope=api-migrate
          cache-to: type=gha,scope=api-migrate,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.nginx
          push: true
          build-args: VITE_API_BASE_URL=/api
          tags: |
            ${{ steps.image.outputs.web }}:latest
            ${{ steps.image.outputs.web }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Set up the SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # ---------------------------------------------------------- the server
      # Try the configured address first, then the addresses this project has
      # used, and both of the user accounts an EC2 image can have. The first
      # combination that answers `true` wins.
      - name: Find the server
        id: find
        env:
          CONFIGURED_HOST: ${{ vars.DEPLOY_HOST }}
          CONFIGURED_USER: ${{ vars.DEPLOY_USER }}
          CONFIGURED_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          hosts=$(printf '%s\n' "${CONFIGURED_HOST:-}" 3.107.83.86 13.55.90.25 | awk 'NF && !seen[$0]++')
          users=$(printf '%s\n' "${CONFIGURED_USER:-}" ubuntu ec2-user | awk 'NF && !seen2[$0]++')
          attempts=/tmp/ssh-attempts.log
          : > "$attempts"

          for host in $hosts; do
            for user in $users; do
              echo "--- ${user}@${host}"
              if timeout --kill-after=5s 20s ssh -o BatchMode=yes -o ConnectTimeout=8 \
                     -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
                     -o StrictHostKeyChecking=accept-new \
                     "${user}@${host}" true 2>>"$attempts"; then
                echo "reachable: ${user}@${host}"
                {
                  echo "host=${host}"
                  echo "user=${user}"
                  echo "path=${CONFIGURED_PATH:-}"
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done

          # Nothing answered. Surface why, in a place that survives a log that
          # cannot be downloaded.
          detail=$(grep -E "Permission denied|timed out|No route|Could not resolve|Connection refused" \
                   "$attempts" | tail -4 | tr '\n' '; ' || true)
          echo "::error title=No reachable server::Tried $(echo $hosts | wc -w) address(es) x $(echo $users | wc -w) user(s). ${detail:-see the job log}"
          echo "hosts: $hosts"
          echo "users: $users"
          cat "$attempts"
          exit 1

      # ---------------------------------------------------------- the deploy
      - name: Deploy
        timeout-minutes: 20
        env:
          HOST: ${{ steps.find.outputs.host }}
          USER: ${{ steps.find.outputs.user }}
          CONFIGURED_PATH: ${{ steps.find.outputs.path }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          MIGRATE_IMAGE: ${{ steps.image.outputs.migrate }}:${{ github.sha }}
          WEB_IMAGE: ${{ steps.image.outputs.web }}:${{ github.sha }}
        run: |
          set -uo pipefail
          out=/tmp/deploy-remote.log

          # The checkout lives in a different place on a hand-built host than on
          # one made by provision-host.sh, so let the server pick the directory
          # that actually contains the compose file.
          # Quote each remote argument: ssh otherwise joins arguments as shell
          # text. Keep the server deadline shorter than the client/step deadline.
          printf -v remote_command '%q ' timeout --signal=TERM --kill-after=30s 15m \
            bash -s -- "${CONFIGURED_PATH:-}" "$IMAGE" "$MIGRATE_IMAGE" "$WEB_IMAGE"
          # pipefail preserves SSH/timeout failure even when tee succeeds.
          # Do not enable xtrace: the host sources its private .env file.
          if ! timeout --kill-after=30s 18m ssh -T \
                 -o BatchMode=yes -o ConnectTimeout=10 \
                 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
                 -o StrictHostKeyChecking=accept-new \
                 "${USER}@${HOST}" "$remote_command" \
                 2>&1 <<'REMOTE' | tee "$out"
          set -euo pipefail
          configured_path="${1:-}"
          image="$2"
          migrate_image="$3"
          web_image="$4"

          # A disconnected client can leave work behind. Serialise newer runs
          # on the host too; never kill an unknown existing deployment.
          state_dir="${XDG_STATE_HOME:-$HOME/.local/state}/assetflow"
          mkdir -p "$state_dir"
          exec 9>"$state_dir/deploy.lock"
          if ! flock -n 9; then
            echo "another deployment holds the host lock; inspect it before retrying"
            exit 2
          fi

          for candidate in "$configured_path" /opt/assetflow "$HOME/assetflow" /home/ubuntu/assetflow; do
            [ -n "$candidate" ] || continue
            if [ -f "$candidate/infra/docker-compose.yml" ]; then
              deploy_path="$candidate"
              break
            fi
          done
          if [ -z "${deploy_path:-}" ]; then
            echo "no checkout with infra/docker-compose.yml found (tried: $configured_path /opt/assetflow $HOME/assetflow /home/ubuntu/assetflow)"
            exit 3
          fi
          echo "=== deploying from $deploy_path as $(id -un)@$(hostname) ==="
          cd "$deploy_path"

          # A queued old run must not combine its image with newer Compose or
          # migrations fetched from main. Fast-forward only to this image SHA;
          # never reset/discard server changes or downgrade a newer checkout.
          target_commit="${image##*:}"
          if [[ ! "$target_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "the image must be tagged with a full commit SHA"
            exit 4
          fi
          if [ "${migrate_image##*:}" != "$target_commit" ] || [ "${web_image##*:}" != "$target_commit" ]; then
            echo "API, migration and web images must use the same commit SHA"
            exit 4
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "server checkout has tracked changes; refusing to overwrite them"
            git status --short
            exit 4
          fi
          git fetch origin "$target_commit" || exit 4
          if ! git merge --ff-only "$target_commit" || [ "$(git rev-parse HEAD)" != "$target_commit" ]; then
            echo "server checkout is newer or divergent; refusing to mix code and image commits"
            git log --oneline -3
            exit 4
          fi

          chmod +x infra/scripts/*.sh

          # deploy.sh pulls the image, migrates, starts the new version, checks
          # the health endpoint and rolls back on failure.
          IMAGE="$image" MIGRATE_IMAGE="$migrate_image" WEB_IMAGE="$web_image" \
            infra/scripts/deploy.sh || exit 5

          # Images were compiled on the runner and pulled by deploy.sh. Never
          # fall back to compiling a missing image on the production server.
          echo "=== activating prebuilt web image $web_image ==="
          WEB_IMAGE="$web_image" docker compose --project-directory infra -f infra/docker-compose.yml \
            up -d --no-deps --no-build --pull never --wait --wait-timeout 90 nginx || exit 7
          REMOTE
          then
            echo "::error title=Deploy failed::Remote deployment failed, timed out, or lost its connection. Inspect the live log and server state before retrying; timeout does not guarantee rollback."
            tail -60 "$out"
            exit 1
          fi

          tail -40 "$out"

      - name: Verify the deployment on the host
        timeout-minutes: 4
        env:
          HOST: ${{ steps.find.outputs.host }}
          USER: ${{ steps.find.outputs.user }}
        run: |
          set -uo pipefail
          # Probe from the host itself. Over the public interface Nginx answers
          # HTTP with a 301 to HTTPS, and `curl -f` accepts a 301 — the check
          # would pass even with the API down.
          for attempt in $(seq 1 10); do
            if timeout --kill-after=5s 12s ssh -o BatchMode=yes -o ConnectTimeout=5 \
                 -o ServerAliveInterval=5 -o ServerAliveCountMax=1 \
                 -o StrictHostKeyChecking=accept-new \
                 "${USER}@${HOST}" \
                 'status=$(curl -sS --max-time 5 -o /dev/null -w "%{http_code}" http://127.0.0.1/api/health/ready); printf "readiness HTTP %s\n" "$status"; [ "$status" = 200 ]'; then
              echo "the API is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Unhealthy after deploy::/api/health/ready did not answer on the host after bounded retries. Inspect the host; this verification step does not roll back the deployment."
          exit 1
