# Deploys the API to the self-hosted server.
#
#   find the server  ->  build the image  ->  push it to GHCR  ->  connect over SSH
#                    ->  run the migrations  ->  start it  ->  health check
#                    ->  roll back when the health check fails
#
# The variables (GitHub → Settings → Secrets and variables → Actions →
# Variables — they are not secret):
#   DEPLOY_HOST        the server address (optional: discovered when unset)
#   DEPLOY_USER        the SSH user (key authentication only; optional)
#   DEPLOY_PATH        the checkout on the server (optional: discovered)
#
# The secrets (the same page → Secrets):
#   DEPLOY_SSH_KEY    the private key of the deploy user
#
# Why the discovery step exists
# -----------------------------
# The deploy used to read `vars.DEPLOY_HOST` and nothing else. When that value
# went stale (the instance's address changed) the whole job died on a bare
# "connection timed out" with no indication of which address or user was tried,
# and the run log was the only place that said so. Discovery makes the job
# self-healing across an address change and, when it still cannot connect, it
# says exactly which combinations it tried and why each one failed — both on
# stdout and, for a run whose log is not reachable, as a check annotation.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The build cache of the images is kept in the GitHub Actions cache.
      actions: write
    steps:
      - uses: actions/checkout@v7

      # GHCR only accepts a lowercase repository name, and the GitHub owner
      # here is `BhaveshSab` — so the name is computed once, in Bash, and
      # reused by the build and the deploy.
      - name: The image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/assetflow-api" >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.api
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up the SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # ---------------------------------------------------------- the server
      # Try the configured address first, then the addresses this project has
      # used, and both of the user accounts an EC2 image can have. The first
      # combination that answers `true` wins.
      - name: Find the server
        id: find
        env:
          CONFIGURED_HOST: ${{ vars.DEPLOY_HOST }}
          CONFIGURED_USER: ${{ vars.DEPLOY_USER }}
          CONFIGURED_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          hosts=$(printf '%s\n' "${CONFIGURED_HOST:-}" 3.107.83.86 13.55.90.25 | awk 'NF && !seen[$0]++')
          users=$(printf '%s\n' "${CONFIGURED_USER:-}" ubuntu ec2-user | awk 'NF && !seen2[$0]++')
          attempts=/tmp/ssh-attempts.log
          : > "$attempts"

          for host in $hosts; do
            for user in $users; do
              echo "--- ${user}@${host}"
              if ssh -o BatchMode=yes -o ConnectTimeout=8 \
                     -o StrictHostKeyChecking=accept-new \
                     "${user}@${host}" true 2>>"$attempts"; then
                echo "reachable: ${user}@${host}"
                {
                  echo "host=${host}"
                  echo "user=${user}"
                  echo "path=${CONFIGURED_PATH:-}"
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done

          # Nothing answered. Surface why, in a place that survives a log that
          # cannot be downloaded.
          detail=$(grep -E "Permission denied|timed out|No route|Could not resolve|Connection refused" \
                   "$attempts" | tail -4 | tr '\n' '; ' || true)
          echo "::error title=No reachable server::Tried $(echo $hosts | wc -w) address(es) x $(echo $users | wc -w) user(s). ${detail:-see the job log}"
          echo "hosts: $hosts"
          echo "users: $users"
          cat "$attempts"
          exit 1

      # ---------------------------------------------------------- the deploy
      - name: Deploy
        env:
          HOST: ${{ steps.find.outputs.host }}
          USER: ${{ steps.find.outputs.user }}
          CONFIGURED_PATH: ${{ steps.find.outputs.path }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          set -uo pipefail
          out=/tmp/deploy-remote.log

          # The checkout lives in a different place on a hand-built host than on
          # one made by provision-host.sh, so let the server pick the directory
          # that actually contains the compose file.
          if ! ssh -o BatchMode=yes -o ConnectTimeout=10 \
                 -o StrictHostKeyChecking=accept-new \
                 "${USER}@${HOST}" bash -s -- "${CONFIGURED_PATH:-}" "$IMAGE" \
                 >"$out" 2>&1 <<'REMOTE'
          set -uo pipefail
          configured_path="${1:-}"
          image="$2"

          for candidate in "$configured_path" /opt/assetflow "$HOME/assetflow" /home/ubuntu/assetflow; do
            [ -n "$candidate" ] || continue
            if [ -f "$candidate/infra/docker-compose.yml" ]; then
              deploy_path="$candidate"
              break
            fi
          done
          if [ -z "${deploy_path:-}" ]; then
            echo "no checkout with infra/docker-compose.yml found (tried: $configured_path /opt/assetflow $HOME/assetflow /home/ubuntu/assetflow)"
            exit 3
          fi
          echo "=== deploying from $deploy_path as $(id -un)@$(hostname) ==="
          cd "$deploy_path"

          # The scripts and the compose files are always the current ones.
          if ! git pull --ff-only origin main; then
            echo "git pull failed — the server checkout is not on a clean origin/main:"
            git status --short || true
            git log --oneline -3 || true
            exit 4
          fi

          chmod +x infra/scripts/*.sh

          # deploy.sh pulls the image, migrates, starts the new version, checks
          # the health endpoint and rolls back on failure.
          IMAGE="$image" infra/scripts/deploy.sh || exit 5

          # The SPA is served by the Nginx container on this host, and its image
          # is built here from this checkout — deploy.sh only replaces the API.
          # Without this step a frontend commit would be in main and never reach
          # the browser. Recreate just that container.
          docker compose --project-directory infra -f infra/docker-compose.yml build nginx || exit 6
          docker compose --project-directory infra -f infra/docker-compose.yml up -d --no-deps nginx || exit 7
          REMOTE
          then
            echo "::error title=Deploy failed::$(tail -6 "$out" | tr '\n' ' ' | cut -c1-900)"
            tail -60 "$out"
            exit 1
          fi

          tail -40 "$out"

      - name: Verify the deployment on the host
        env:
          HOST: ${{ steps.find.outputs.host }}
          USER: ${{ steps.find.outputs.user }}
        run: |
          set -uo pipefail
          # Probe from the host itself. Over the public interface Nginx answers
          # HTTP with a 301 to HTTPS, and `curl -f` accepts a 301 — the check
          # would pass even with the API down.
          for attempt in $(seq 1 10); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
                 "${USER}@${HOST}" \
                 'curl -fsS --max-time 5 http://127.0.0.1/api/health/ready'; then
              echo "the API is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Unhealthy after deploy::/api/health/ready did not answer on the host after 100s; deploy.sh rolls back on its own when the health check fails."
          exit 1
